<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Blog Page</title>
        <style>
            /* Global Styles */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                color: #333;
                background-color: #f9f9f9;
            }
            h1 {
                font-size: 36px;
                margin-bottom: 20px;
            }
            /* Container Styles */
           .container {
                max-width: 800px;
                margin: 40px auto;
                padding: 20px;
                background-color: #fff;
                border: 1px solid #ddd;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            /* Title Styles */
           .title {
                font-size: 24px;
                font-weight: bold;
                margin-bottom: 10px;
            }
            /* Content Styles */
           .content {
                font-size: 18px;
                margin-bottom: 20px;
            }
            /* Tags Styles */
           .tags {
                font-size: 16px;
                color: #666;
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="title">{{view.title}}</h1>
            <div class="content">{{view.content}}</div>
            <div class="tags">Tag:{{view.tags}}</div>
        </div>
    </body>
</html>
