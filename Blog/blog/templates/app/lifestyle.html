<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Blog Page</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }
    </style>
   
</head>
<body>
    <div class="col-sm-3">
        <div class="list-group">
            {% if data %}
                {% for datas in data %}
                    <h1>{{datas.title}}</h1>
                    <p>{{datas.content}}</p>
                {% endfor %}
            
            {% else %} 
                <h1>No categories available.</h1>

            {% endif %}    
        </div>
   </div>

</body>
</html>
